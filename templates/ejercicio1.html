{% extends "base.html" %}{% block title %}Ejercicio 1{% endblock %}{% block content %}
<section class="panel"><h2>Formulario de notas</h2><p>Notas entre 10 y 70; asistencia entre 0 y 100.</p>
<form method="POST"><label>Nota 1:</label><input type="number" name="nota1" min="10" max="70" step="0.1" required>
<label>Nota 2:</label><input type="number" name="nota2" min="10" max="70" step="0.1" required>
<label>Nota 3:</label><input type="number" name="nota3" min="10" max="70" step="0.1" required>
<label>Asistencia (%):</label><input type="number" name="asistencia" min="0" max="100" step="0.1" required>
<button type="submit">Enviar</button></form><a class="volver" href="{{ url_for('inicio') }}">Volver al menú</a></section>{% endblock %}
